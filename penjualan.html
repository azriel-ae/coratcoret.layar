<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Rekap Penjualan - Corat Coret Layar</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="h-full text-slate-800 antialiased selection:bg-blue-600 selection:text-white bg-slate-900">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <script>
    // Storage Keys Configuration
    const STORAGE_KEYS = {
      API_URL: 'ccl_api_base_url',
      USERS: 'ccl_admin_users',
      SESSION: 'ccl_current_session',
      ACTIVITY: 'ccl_activity_logs',
      LOCAL_SALES: 'ccl_local_sales'
    };

    // Default API Endpoint URL (Relative path untuk Vercel / Same-origin)
    const DEFAULT_API_URL = '/api';

    // Helper Utility: Formatting Rupiah Currency
    function formatIDR(amount) {
      const numericVal = Number(amount) || 0;
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
      }).format(numericVal);
    }

    // Helper Utility: Formatting Date
    function formatDate(dateString) {
      if (!dateString) return '-';
      try {
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return '-';
        return new Intl.DateTimeFormat('id-ID', {
          day: 'numeric',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }).format(date);
      } catch (e) {
        return '-';
      }
    }

    // Helper Utility: Render Status Badges safely
    function renderStatusBadge(status) {
      const s = (status || 'Completed').toString().toLowerCase();
      if (s.includes('completed') || s.includes('lunas') || s.includes('sukses')) {
        return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-700 border border-emerald-500/20">
                  <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Selesai
                </span>`;
      } else if (s.includes('pending') || s.includes('proses') || s.includes('menunggu')) {
        return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-500/10 text-amber-700 border border-amber-500/20">
                  <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-amber-500"></span> Pending
                </span>`;
      } else {
        return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-semibold bg-rose-500/10 text-rose-700 border border-rose-500/20">
                  <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-rose-500"></span> Dibatalkan
                </span>`;
      }
    }

    // AuthService Module
    const AuthService = {
      getSession() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEYS.SESSION) || 'null');
        } catch (e) {
          return null;
        }
      },

      setSession(session) {
        localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(session));
      },

      clearSession() {
        localStorage.removeItem(STORAGE_KEYS.SESSION);
      },

      login(username, password) {
        const cleanUser = (username || '').trim().toLowerCase();
        if (cleanUser === 'admin' && password === '123') {
          const session = {
            username: 'admin',
            name: 'Administrator CCL',
            role: 'Owner',
            loginAt: new Date().toISOString()
          };
          this.setSession(session);
          this.logActivity('admin', 'Berhasil masuk ke dashboard');
          return { success: true };
        }
        return { success: false, message: 'Username atau Password salah!' };
      },

      logout() {
        const current = this.getSession();
        if (current) {
          this.logActivity(current.username, 'Keluar dari dashboard');
        }
        this.clearSession();
        AppState.render();
      },

      logActivity(username, action) {
        try {
          const logs = JSON.parse(localStorage.getItem(STORAGE_KEYS.ACTIVITY) || '[]');
          logs.unshift({
            id: 'LOG-' + Date.now(),
            username,
            action,
            timestamp: new Date().toISOString()
          });
          localStorage.setItem(STORAGE_KEYS.ACTIVITY, JSON.stringify(logs.slice(0, 100)));
        } catch (e) {
          console.error('Error logging activity:', e);
        }
      },

      getActivityLogs() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEYS.ACTIVITY) || '[]');
        } catch (e) {
          return [];
        }
      }
    };

    // ApiService Module
    const ApiService = {
      getApiUrl() {
        return localStorage.getItem(STORAGE_KEYS.API_URL) || DEFAULT_API_URL;
      },

      setApiUrl(url) {
        localStorage.setItem(STORAGE_KEYS.API_URL, url);
      },

      async fetchSalesData() {
        try {
          const baseUrl = this.getApiUrl();
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6000);

          const res = await fetch(`${baseUrl}/v1/sales?_t=${Date.now()}`, {
            signal: controller.signal,
            cache: 'no-store'
          });
          clearTimeout(timeoutId);

          if (res.ok) {
            const data = await res.json();
            const apiSales = Array.isArray(data) ? data : (data?.data || data?.sales || []);

            AppState.apiConnectionStatus = {
              success: true,
              message: `Terhubung ke API Server — ${apiSales.length} transaksi ditemukan`
            };
            return apiSales;
          }
          throw new Error(`HTTP ${res.status}: ${res.statusText || 'Gagal memuat API'}`);
        } catch (error) {
          const cachedSales = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_SALES) || '[]');
          AppState.apiConnectionStatus = {
            success: false,
            message: `Terhubung ke cache lokal (${error.message || 'Server API belum merespons'})`
          };
          return cachedSales;
        }
      },

      async deleteSalesData(id) {
        try {
          const baseUrl = this.getApiUrl();
          const res = await fetch(`${baseUrl}/v1/sales?id=${encodeURIComponent(id)}`, {
            method: 'DELETE'
          });
          return { success: res.ok };
        } catch (error) {
          console.warn('API delete warning:', error);
          return { success: false, error: error.message };
        }
      }
    };

    // AppState Application Core State
    const AppState = {
      activeTab: 'dashboard',
      salesRaw: [],
      loading: false,
      apiError: null,
      lastUpdated: null,
      apiConnectionStatus: { success: false, message: 'Belum dicek' },
      autoSyncEnabled: true,
      autoSyncTimer: null,
      mobileMenuOpen: false,

      // Toast Notifications
      toastMessage: null,

      // Transaksi Filters & Selection
      txSearch: '',
      txStatus: 'ALL',
      selectedTx: null,
      deleteConfirmTx: null,

      // Modals
      txModalOpen: false,

      toggleAutoSync() {
        this.autoSyncEnabled = !this.autoSyncEnabled;
        if (this.autoSyncTimer) clearInterval(this.autoSyncTimer);
        
        if (this.autoSyncEnabled) {
          this.showToast('Auto-Sync Diaktifkan (Update otomatis tiap 15 detik)');
          this.autoSyncTimer = setInterval(() => {
            this.loadData();
          }, 15000);
        } else {
          this.showToast('Auto-Sync Dimatikan');
        }
        this.render();
      },

      // Transaksi Filters
      txSearch: '',
      txStatus: 'ALL',
      selectedTx: null,

      // Modals
      txModalOpen: false,

      async loadData() {
        this.loading = true;
        this.render();

        try {
          const sales = await ApiService.fetchSalesData();
          this.salesRaw = sales || [];
          this.lastUpdated = new Date().toISOString();
          this.apiError = null;

          if (this.apiConnectionStatus.success) {
            localStorage.setItem(STORAGE_KEYS.LOCAL_SALES, JSON.stringify(this.salesRaw));
          }
        } catch (err) {
          this.apiError = 'Gagal memuat data otomatis. Menampilkan cache lokal saat ini.';
        } finally {
          this.loading = false;
          this.render();
        }
      },

      showToast(msg) {
        this.toastMessage = msg;
        this.render();
        setTimeout(() => {
          this.toastMessage = null;
          this.render();
        }, 3500);
      },

      render() {
        const appContainer = document.getElementById('app');
        if (!appContainer) return;

        const session = AuthService.getSession();

        if (!session) {
          appContainer.innerHTML = renderLoginScreen();
        } else {
          appContainer.innerHTML = renderDashboardScreen(session);
        }

        if (window.lucide) {
          window.lucide.createIcons();
        }
      }
    };

    function computeMetrics(sales) {
      if (!Array.isArray(sales) || sales.length === 0) {
        return {
          totalOmzet: 0,
          totalTxCount: 0,
          completedCount: 0,
          pendingCount: 0,
          avgTxValue: 0,
          todayOmzet: 0
        };
      }

      const nowStr = new Date().toISOString().slice(0, 10);

      let totalOmzet = 0;
      let totalTxCount = sales.length;
      let completedCount = 0;
      let pendingCount = 0;
      let todayOmzet = 0;

      sales.forEach(tx => {
        const amount = Number(tx.total || tx.amount || tx.price || 0);
        const status = (tx.status || 'Completed').toLowerCase();
        const dateStr = (tx.date || tx.created_at || '').slice(0, 10);

        if (status.includes('completed') || status.includes('lunas') || status.includes('sukses')) {
          totalOmzet += amount;
          completedCount++;
          if (dateStr === nowStr) {
            todayOmzet += amount;
          }
        } else if (status.includes('pending') || status.includes('proses')) {
          pendingCount++;
        }
      });

      const avgTxValue = completedCount > 0 ? totalOmzet / completedCount : 0;

      return {
        totalOmzet,
        totalTxCount,
        completedCount,
        pendingCount,
        avgTxValue,
        todayOmzet
      };
    }

    function renderLoginScreen() {
      return `
        <div class="min-h-screen bg-slate-950 flex items-center justify-center p-4 relative overflow-hidden">
          <!-- Background Ambient Lighting -->
          <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-[128px] pointer-events-none"></div>
          <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-[128px] pointer-events-none"></div>

          <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-slate-800/80 z-10 space-y-6 animate-fade-in">
            <div class="text-center space-y-3">
              <div class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-500 text-white rounded-2xl mx-auto flex items-center justify-center shadow-xl shadow-blue-500/20 ring-4 ring-slate-800/50">
                <i data-lucide="layers" class="w-7 h-7"></i>
              </div>
              <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Corat Coret Layar</h1>
                <p class="text-xs text-slate-400 mt-1">Dashboard Rekapitulasi Penjualan</p>
              </div>
            </div>

            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
              <div id="login-error" class="hidden p-3.5 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-xl text-xs flex items-center space-x-2.5">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span id="login-error-text">Username atau Password salah!</span>
              </div>

              <div class="space-y-1.5">
                <label class="text-xs font-semibold text-slate-300">Username</label>
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                    <i data-lucide="user" class="w-4 h-4"></i>
                  </span>
                  <input 
                    type="text" 
                    id="input-username" 
                    placeholder="Masukkan username" 
                    required 
                    autocomplete="username"
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-800 text-slate-100 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition placeholder:text-slate-600"
                  />
                </div>
              </div>

              <div class="space-y-1.5">
                <label class="text-xs font-semibold text-slate-300">Password</label>
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                    <i data-lucide="lock" class="w-4 h-4"></i>
                  </span>
                  <input 
                    type="password" 
                    id="input-password" 
                    placeholder="Masukkan password" 
                    required 
                    autocomplete="current-password"
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-800 text-slate-100 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition placeholder:text-slate-600"
                  />
                </div>
              </div>

              <button 
                type="submit" 
                class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl text-xs shadow-lg shadow-blue-500/25 transition active:scale-[0.99] flex items-center justify-center space-x-2 mt-2"
              >
                <span>Masuk Ke Dashboard</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </button>
            </form>

            <div class="pt-4 text-center border-t border-slate-800/80">
              <p class="text-[11px] text-slate-500">Corat Coret Layar &copy; 2026. All rights reserved.</p>
            </div>
          </div>
        </div>
      `;
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('input-username').value;
      const password = document.getElementById('input-password').value;

      const res = AuthService.login(username, password);
      if (res.success) {
        AppState.loadData();
      } else {
        const errBox = document.getElementById('login-error');
        const errText = document.getElementById('login-error-text');
        if (errBox && errText) {
          errText.textContent = res.message;
          errBox.classList.remove('hidden');
        }
      }
    }

    function renderDashboardScreen(session) {
      const metrics = computeMetrics(AppState.salesRaw);

      return `
        <div class="flex-1 flex flex-col md:flex-row min-h-screen bg-slate-900">
          <!-- Sidebar Navigation -->
          <aside class="w-full md:w-64 bg-slate-950 text-slate-300 flex flex-col justify-between shrink-0 border-b md:border-b-0 md:border-r border-slate-800/80">
            <div>
              <!-- Logo Header -->
              <div class="p-5 border-b border-slate-800/80 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                  <div class="w-9 h-9 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-xl flex items-center justify-center font-bold shadow-md shadow-blue-500/20 shrink-0">
                    <i data-lucide="layers" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h1 class="font-bold text-white text-sm tracking-tight">Corat Coret Layar</h1>
                    <p class="text-[10px] text-slate-500">Rekap Penjualan</p>
                  </div>
                </div>

                <!-- Mobile Menu Toggle Button -->
                <button 
                  onclick="AppState.mobileMenuOpen = !AppState.mobileMenuOpen; AppState.render();"
                  class="md:hidden p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-900"
                >
                  <i data-lucide="${AppState.mobileMenuOpen ? 'x' : 'menu'}" class="w-5 h-5"></i>
                </button>
              </div>

              <!-- Nav Menu Items -->
              <nav class="${AppState.mobileMenuOpen ? 'block' : 'hidden'} md:block p-3 space-y-1 text-xs font-semibold">
                <button 
                  onclick="AppState.activeTab='dashboard'; AppState.mobileMenuOpen=false; AppState.render();"
                  class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl transition ${AppState.activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'hover:bg-slate-900 text-slate-400 hover:text-white'}"
                >
                  <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                  <span>Ringkasan Dashboard</span>
                </button>

                <button 
                  onclick="AppState.activeTab='transactions'; AppState.mobileMenuOpen=false; AppState.render();"
                  class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl transition ${AppState.activeTab === 'transactions' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'hover:bg-slate-900 text-slate-400 hover:text-white'}"
                >
                  <i data-lucide="receipt" class="w-4 h-4"></i>
                  <span>Data Transaksi</span>
                  <span class="ml-auto bg-slate-800/80 text-slate-300 text-[10px] px-2 py-0.5 rounded-md font-mono">${AppState.salesRaw.length}</span>
                </button>

                <button 
                  onclick="AppState.activeTab='activity'; AppState.mobileMenuOpen=false; AppState.render();"
                  class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl transition ${AppState.activeTab === 'activity' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'hover:bg-slate-900 text-slate-400 hover:text-white'}"
                >
                  <i data-lucide="history" class="w-4 h-4"></i>
                  <span>Log Aktivitas</span>
                </button>

                <button 
                  onclick="AppState.activeTab='settings'; AppState.mobileMenuOpen=false; AppState.render();"
                  class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl transition ${AppState.activeTab === 'settings' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'hover:bg-slate-900 text-slate-400 hover:text-white'}"
                >
                  <i data-lucide="sliders" class="w-4 h-4"></i>
                  <span>Pengaturan API</span>
                </button>
              </nav>
            </div>

            <!-- User Session Footer & Logout -->
            <div class="${AppState.mobileMenuOpen ? 'block' : 'hidden'} md:block p-4 border-t border-slate-800/80 bg-slate-950">
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5 overflow-hidden">
                  <div class="w-8 h-8 rounded-xl bg-blue-600/20 text-blue-400 font-bold flex items-center justify-center shrink-0 border border-blue-500/30 text-xs">
                    ${session.username.charAt(0).toUpperCase()}
                  </div>
                  <div class="truncate">
                    <p class="text-xs font-bold text-white truncate">${session.name || session.username}</p>
                    <p class="text-[10px] text-slate-500 capitalize">${session.role}</p>
                  </div>
                </div>

                <button 
                  onclick="AuthService.logout()" 
                  title="Keluar Sesi"
                  class="p-2 text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition"
                >
                  <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </aside>

          <!-- Main Content Area -->
          <main class="flex-1 flex flex-col bg-slate-900 overflow-y-auto">
            <!-- Header Top Bar -->
            <header class="bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-20">
              <div>
                <h2 class="text-base font-bold text-white capitalize flex items-center space-x-2">
                  <span>${getTabTitle(AppState.activeTab)}</span>
                </h2>
                <div class="flex items-center space-x-2 mt-0.5">
                  <span class="inline-flex items-center text-[11px] text-slate-400">
                    Update Terakhir: ${AppState.lastUpdated ? formatDate(AppState.lastUpdated) : 'Belum pernah'}
                  </span>
                  <span class="text-slate-700">•</span>
                  <span class="inline-flex items-center text-[11px] font-medium ${AppState.apiConnectionStatus.success ? 'text-emerald-400' : 'text-amber-400'}">
                    <span class="w-1.5 h-1.5 rounded-full ${AppState.apiConnectionStatus.success ? 'bg-emerald-400' : 'bg-amber-400'} mr-1.5 animate-pulse"></span>
                    ${AppState.apiConnectionStatus.message}
                  </span>
                </div>
              </div>

              <div class="flex items-center space-x-2.5">
                <button 
                  onclick="AppState.toggleAutoSync()" 
                  class="px-3 py-1.5 ${AppState.autoSyncEnabled ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-slate-800 text-slate-400 border-slate-700'} border text-xs font-semibold rounded-xl flex items-center space-x-1.5 transition hover:brightness-110"
                >
                  <i data-lucide="refresh-cw" class="w-3.5 h-3.5 ${AppState.autoSyncEnabled ? 'text-emerald-400 animate-spin' : ''}"></i>
                  <span>Auto-Sync: ${AppState.autoSyncEnabled ? 'ON' : 'OFF'}</span>
                </button>

                <button 
                  onclick="AppState.loadData()" 
                  class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl flex items-center space-x-1.5 transition border border-slate-700"
                >
                  <i data-lucide="rotate-cw" class="w-3.5 h-3.5 ${AppState.loading ? 'animate-spin text-blue-400' : ''}"></i>
                  <span>Refresh</span>
                </button>

                <button 
                  onclick="openAddTxModal()" 
                  class="px-3.5 py-1.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-bold rounded-xl flex items-center space-x-1.5 shadow-lg shadow-blue-500/20 transition active:scale-95"
                >
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span>Transaksi Baru</span>
                </button>
              </div>
            </header>

            <!-- Notification Toast / Alert -->
            ${AppState.toastMessage ? `
              <div class="mx-6 mt-4 p-3 bg-emerald-600 text-white rounded-xl text-xs shadow-xl flex items-center justify-between animate-fade-in">
                <div class="flex items-center space-x-2">
                  <i data-lucide="check-circle-2" class="w-4 h-4 shrink-0"></i>
                  <span class="font-medium">${AppState.toastMessage}</span>
                </div>
              </div>
            ` : ''}

            ${AppState.apiError ? `
              <div class="mx-6 mt-4 p-3.5 bg-amber-500/10 border border-amber-500/20 text-amber-300 rounded-xl text-xs flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                  <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-400 shrink-0"></i>

      const status = document.getElementById('tx-form-status').value;

      const now = new Date();
      const invNum = 'INV-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '-' + Math.floor(100 + Math.random() * 900);

      const newTx = {
        id: 'TX-' + Date.now(),
        invoice: invNum,
        customer,
        product,
        qty,
        total,
        payment_method: payment,
        status,
        date: now.toISOString()
      };

      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Menyimpan...'; }

      try {
        const baseUrl = ApiService.getApiUrl();
        const res = await fetch(`${baseUrl}/v1/sales`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newTx)
        });
        const data = await res.json().catch(() => null);
        if (!res.ok || !data?.success) {
          throw new Error(data?.error || `HTTP ${res.status}`);
        }

        const session = AuthService.getSession();
        if (session) {
          AuthService.logActivity(session.username, `Menambah transaksi baru: ${invNum} (${formatIDR(total)})`);
        }

        AppState.txModalOpen = false;
        AppState.showToast(`Transaksi ${invNum} berhasil disimpan ke server!`);
        AppState.loadData();
      } catch (err) {
        AppState.showToast(`Gagal menyimpan ke server: ${err.message}. Cek Pengaturan API.`);
        AppState.render();
      }
    }

    function renderTxDetailModal() {
      const tx = AppState.selectedTx;
      if (!tx) return '';

      return `
        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
          <div class="bg-slate-900 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4 border border-slate-800 text-slate-200">
            <div class="flex items-center justify-between border-b pb-3 border-slate-800">
              <div>
                <h3 class="font-bold text-white font-mono text-sm">${tx.invoice || tx.id}</h3>
                <p class="text-[11px] text-slate-400">${formatDate(tx.date || tx.created_at)}</p>
              </div>
              <button onclick="closeTxDetail()" class="text-slate-400 hover:text-white p-1 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <div class="space-y-3 text-xs">
              <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800/80 space-y-1">
                <p class="text-slate-400 font-medium">Pelanggan</p>
                <p class="font-bold text-white">${tx.customer || 'Pelanggan Umum'}</p>
              </div>

              <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800/80 space-y-1">
                <p class="text-slate-400 font-medium">Produk / Layanan</p>
                <p class="font-bold text-white">${tx.product || tx.items || 'Layanan Cetak'}</p>
                <p class="text-slate-400">Jumlah Qty: ${tx.qty || 1}</p>
              </div>

              <div class="flex justify-between items-center bg-slate-950 p-3.5 rounded-xl border border-slate-800/80">
                <div>
                  <p class="text-slate-400 font-medium">Total Pembayaran</p>
                  <p class="font-extrabold text-white font-mono text-base">${formatIDR(tx.total || tx.amount || 0)}</p>
                </div>
                <div>
                  ${renderStatusBadge(tx.status)}
                </div>
              </div>

              <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800/80 space-y-1">
                <p class="text-slate-400 font-medium">Metode Pembayaran</p>
                <p class="font-bold text-white">${tx.payment_method || 'QRIS'}</p>
              </div>
            </div>

            <div class="pt-2 flex justify-between items-center border-t border-slate-800/80">
              <button 
                onclick="closeTxDetail(); openDeleteConfirm('${tx.invoice || tx.id}');" 
                class="px-3.5 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 text-xs font-bold rounded-xl flex items-center space-x-1.5 transition"
              >
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                <span>Hapus Transaksi</span>
              </button>
              <button onclick="closeTxDetail()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl">Tutup</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderDeleteConfirmModal() {
      const tx = AppState.deleteConfirmTx;
      if (!tx) return '';

      const invNum = tx.invoice || tx.id;
      return `
        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
          <div class="bg-slate-900 rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4 border border-rose-500/20 text-slate-200">
            <div class="flex items-center space-x-3 text-rose-400">
              <div class="p-3 bg-rose-500/10 rounded-2xl border border-rose-500/20 shrink-0">
                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
              </div>
              <div>
                <h3 class="font-bold text-white text-sm">Hapus Transaksi?</h3>
                <p class="text-xs text-rose-400/80 font-mono">${invNum}</p>
              </div>
            </div>

            <p class="text-xs text-slate-300 leading-relaxed">
              Apakah Anda yakin ingin menghapus transaksi <strong class="text-white">${tx.customer || 'Pelanggan'}</strong> senilai <strong class="text-white">${formatIDR(tx.total || tx.amount || 0)}</strong>? Tindakan ini tidak dapat dibatalkan.
            </p>

            <div class="pt-3 flex justify-end space-x-2 border-t border-slate-800">
              <button 
                onclick="closeDeleteConfirm()" 
                class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition"
              >
                Batal
              </button>
              <button 
                onclick="handleExecuteDelete()" 
                class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-rose-600/20 transition flex items-center space-x-1.5"
              >
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                <span>Ya, Hapus</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function openDeleteConfirm(invOrId) {
      const found = AppState.salesRaw.find(x => (x.invoice || x.id) === invOrId);
      if (found) {
        AppState.deleteConfirmTx = found;
        AppState.render();
      }
    }

    function closeDeleteConfirm() {
      AppState.deleteConfirmTx = null;
      AppState.render();
    }

    async function handleExecuteDelete() {
      const tx = AppState.deleteConfirmTx;
      if (!tx) return;

      const invNum = tx.invoice || tx.id;

      // Update state & cache lokal
      AppState.salesRaw = AppState.salesRaw.filter(x => (x.invoice || x.id) !== invNum && x.id !== tx.id);
      localStorage.setItem(STORAGE_KEYS.LOCAL_SALES, JSON.stringify(AppState.salesRaw));

      // Kirim req DELETE ke API
      await ApiService.deleteSalesData(tx.id || invNum);

      // Catat log aktivitas
      const session = AuthService.getSession();
      if (session) {
        AuthService.logActivity(session.username, `Menghapus transaksi ${invNum} (${formatIDR(tx.total || tx.amount || 0)})`);
      }

      AppState.deleteConfirmTx = null;
      AppState.selectedTx = null;
      AppState.showToast(`Transaksi ${invNum} berhasil dihapus.`);
      AppState.render();
    }

    function openTxDetail(invOrId) {
      const found = AppState.salesRaw.find(x => (x.invoice || x.id) === invOrId);
      if (found) {
        AppState.selectedTx = found;
        AppState.render();
      }
    }

    function closeTxDetail() {
      AppState.selectedTx = null;
      AppState.render();
    }

    function exportToCSV(data) {
      if (!data || data.length === 0) {
        AppState.showToast('Tidak ada data transaksi untuk diexport.');
        return;
      }

      const headers = ['Invoice', 'Tanggal', 'Pelanggan', 'Produk', 'Qty', 'Total', 'Metode', 'Status'];
      const rows = data.map(tx => [
        `"${tx.invoice || tx.id || ''}"`,
        `"${formatDate(tx.date || tx.created_at)}"`,
        `"${tx.customer || 'Pelanggan Umum'}"`,
        `"${tx.product || 'Layanan'}"`,
        tx.qty || 1,
        tx.total || tx.amount || 0,
        `"${tx.payment_method || 'QRIS'}"`,
        `"${tx.status || 'Completed'}"`
      ]);

      const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `Rekap_Penjualan_CCL_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.addEventListener('DOMContentLoaded', () => {
      AppState.loadData();

      if (AppState.autoSyncEnabled && !AppState.autoSyncTimer) {
        AppState.autoSyncTimer = setInterval(() => {
          AppState.loadData();
        }, 15000);
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        AppState.loadData();
      }
    });
  </script>
</body>
</html>
